# ============================================================
# .github/workflows/ci.yml
# Agentic Scheduler — FSP Integration — Continuous Integration
# ------------------------------------------------------------
# Runs on every pull request targeting develop, staging, or
# main. Validates lint, type-check, and unit tests across the
# entire Turborepo monorepo.
#
# PR: PR-3 — CI/CD Pipeline
# ============================================================

name: CI

on:
  pull_request:
    branches: [develop, staging, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint ────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run generate -w packages/database

      - name: Run lint
        run: npm run lint

  # ── Type-check ──────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run generate -w packages/database

      - name: Build workspace packages
        run: |
          npm run build -w packages/shared-types
          npm run build -w packages/fsp-client
          npm run build -w packages/database

      - name: Type-check apps
        run: npx tsc --noEmit -p apps/api/tsconfig.json && npx tsc --noEmit -p apps/worker/tsconfig.json

  # ── Unit tests ──────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run generate -w packages/database

      - name: Build workspace packages
        run: |
          npm run build -w packages/shared-types
          npm run build -w packages/fsp-client
          npm run build -w packages/database

      - name: Run unit tests
        run: npm test
        env:
          NODE_ENV: test
          # Dummy env vars so modules that import them don't crash at load time
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          AZURE_SERVICE_BUS_CONNECTION_STRING: Endpoint=sb://test.servicebus.windows.net/;SharedAccessKeyName=test;SharedAccessKey=test
